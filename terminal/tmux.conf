# ---------------------------------------------------------------------------
# ~/.tmux.conf  ->  dotfiles/terminal/tmux.conf
#
# Written for people who do not live in tmux. Everything here either removes a
# surprise or makes the session explain itself. Reload with:  Ctrl-b r
#
# The bar at the bottom always shows how to get out, and attaching prints the
# three keys that matter once, so nothing has to be memorised.
# ---------------------------------------------------------------------------

# --- the things a normal terminal does that stock tmux does not ------------
set -g mouse on                 # click panes, drag borders, wheel to scroll
set -g history-limit 50000      # stock is 2000 - one build log eats all of it
set -g base-index 1             # windows start at 1, because keyboards go 1..9
setw -g pane-base-index 1
set -g renumber-windows on      # closing window 2 does not leave a gap

# --- behave like a modern terminal, locally and over ssh -------------------
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc,*:Tc"   # 24-bit colour through tmux/ssh
set -g focus-events on          # editors see focus changes
set -g escape-time 10           # no 500ms wait on Escape in nvim
set -g set-clipboard on         # selection goes to the system clipboard
setw -g mode-keys vi            # Ctrl-b [ then vi keys to scroll/copy
set -g display-panes-time 1500

# --- macOS clipboard (pbcopy/pbpaste) --------------------------------------
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# --- splits that open where you already are --------------------------------
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
bind -r h select-pane -L        # Ctrl-b h/j/k/l moves between panes, repeatably
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# Name the panes once there is more than one, so it is obvious which is which.
set -g pane-border-status top
set -g pane-border-format " #{pane_index} #{pane_current_command} #{pane_current_path} "

# --- a bar that says where you are and how to leave ------------------------
set -g status-interval 5
set -g status-left-length 30
set -g status-left " #[bold]#S#[nobold] "
set -g status-right-length 80
set -g status-right "Ctrl-b d detach | #{?window_zoomed_flag,ZOOM ,}#H %H:%M "
set -g status-style "fg=colour250,bg=colour236"
setw -g window-status-format " #{window_index}:#{window_name} "
setw -g window-status-current-format " #{window_index}:#{window_name} "
setw -g window-status-current-style "fg=colour235,bg=colour114,bold"

# --- say it out loud once per session instead of expecting memory ----------
set-hook -g client-attached 'display-message -d 6000 "tmux: Ctrl-b d detaches (the work keeps running)  |  Ctrl-b [ scrolls  |  mouse works"'
set-hook -g session-created 'display-message -d 6000 "tmux: Ctrl-b d detaches (the work keeps running)  |  Ctrl-b ? lists every key"'
